name: Deploy

# Phase 3+: builds and deploys the FastAPI service as a container once it's
# no longer just a file-backed MVP. Safe to leave in place even before Phase 3
# -- it simply has no deploy target configured yet (see the placeholder step),
# and can be filled in with your chosen host (Fly.io / Railway / Render-class)
# without touching CI or the app code.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync dependencies (sanity check before building image)
        run: uv sync --all-extras --dev

      - name: Run tests before deploying
        run: uv run pytest -v

      - name: Build container image
        run: |
          docker build -t compat-registry:${{ github.sha }} .

      # --- Fill in one of the following once a host is chosen ---
      #
      # Fly.io:
      #   - uses: superfly/flyctl-actions/setup-flyctl@master
      #   - run: flyctl deploy --remote-only
      #     env:
      #       FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      #
      # Railway:
      #   - run: railway up --service compat-registry
      #     env:
      #       RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      #
      - name: Deploy (placeholder -- configure once a host is chosen)
        run: |
          echo "No deploy target configured yet. See comments in this file."
          echo "Image built successfully: compat-registry:${{ github.sha }}"
