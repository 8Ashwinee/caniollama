name: Validate submission

# Phase 2 MVP: before the live POST /submissions endpoint is running publicly,
# submissions land as PRs adding a single JSON file under data/results/. This
# workflow validates each added file against data/schema.json and against the
# suite_version format, then can auto-merge if everything checks out.

on:
  pull_request:
    paths:
      - "data/results/**/*.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Determine changed result files
        id: changed
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD -- 'data/results/**/*.json')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate each changed file against the schema
        run: |
          python - <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          from jsonschema import Draft7Validator

          schema = json.loads(Path("data/schema.json").read_text())
          validator = Draft7Validator(schema)

          files = """${{ steps.changed.outputs.files }}""".strip().splitlines()
          if not files or files == [""]:
              print("No result files changed; nothing to validate.")
              sys.exit(0)

          failed = False
          for f in files:
              path = Path(f)
              if not path.exists():
                  continue  # file was deleted in this PR, not our concern here
              try:
                  data = json.loads(path.read_text())
              except json.JSONDecodeError as exc:
                  print(f"::error file={f}::Invalid JSON: {exc}")
                  failed = True
                  continue

              errors = sorted(validator.iter_errors(data), key=lambda e: e.path)
              for error in errors:
                  print(f"::error file={f}::{error.message}")
                  failed = True

              if not failed:
                  print(f"OK: {f}")

          if failed:
              sys.exit(1)
          PYEOF

      - name: Reject PRs that touch anything outside data/results/
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          OUTSIDE=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD -- . ':!data/results/**/*.json')
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Submission PRs may only add files under data/results/. Found changes to:"
            echo "$OUTSIDE"
            exit 1
          fi
