name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -v

  suite-version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SUITE_VERSION bump if cases.py changed
        run: |
          # Skip on main branch (no base to compare against)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Running on main branch, skipping check"
            exit 0
          fi

          # For PRs, compare against the base branch
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch origin "$BASE_REF"

          # Check if cases.py was modified
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -q "src/compat_check/suite/cases.py"; then
            echo "cases.py was modified, checking if SUITE_VERSION was bumped..."

            # Check if version.py was also modified
            if ! git diff --name-only "origin/$BASE_REF"...HEAD | grep -q "src/compat_check/suite/version.py"; then
              echo "ERROR: cases.py was modified but version.py was not updated"
              echo "Please bump SUITE_VERSION in src/compat_check/suite/version.py"
              exit 1
            fi

            # Check if SUITE_VERSION value actually changed
            if ! git diff "origin/$BASE_REF"...HEAD src/compat_check/suite/version.py | grep -q "^[+-]SUITE_VERSION"; then
              echo "ERROR: version.py was modified but SUITE_VERSION value was not changed"
              echo "Please bump SUITE_VERSION in src/compat_check/suite/version.py"
              exit 1
            fi

            echo "✓ SUITE_VERSION was properly bumped"
          else
            echo "cases.py was not modified, no version bump required"
          fi
